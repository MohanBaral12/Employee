<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(120deg, #a1c4fd, #c2e9fb, #fbc2eb, #fcb69f);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      flex-direction: column;
    }
    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    .login-container {
      margin-top: 60px;
      max-width: 400px;
      background: rgba(255,255,255,0.9);
      border-radius: 18px;
      box-shadow: 0 8px 32px 0 rgba(31,38,135,0.18);
      padding: 2.5rem 2rem 2rem 2rem;
      animation: fadeIn 1.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px);}
      to { opacity: 1; transform: none;}
    }
    .login-title {
      font-weight: 700;
      color: #0d6efd;
      margin-bottom: 1.5rem;
    }
    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 5px rgba(13, 110, 253, 0.3);
    }
    .btn-login {
      background: linear-gradient(45deg, #0d6efd, #0056b3);
      color: #fff;
      font-weight: 600;
      border: none;
      transition: background 0.3s;
    }
    .btn-login:hover {
      background: linear-gradient(45deg, #0056b3, #003d7a);
      color: #fff;
    }
    .login-icon {
      font-size: 2.5rem;
      color: #0d6efd;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 2px 8px #0d6efd33);
    }
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: #888;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  {% include 'navbar.html'%}

  <div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="login-container shadow">
      <div class="text-center">
        <span class="login-icon"><i class="bi bi-person-circle"></i></span>
        <h2 class="login-title">Sign In</h2>
      </div>
      <form method="post" action="/login/">
        {% csrf_token %}
        {% if form.errors %}
          <div class="alert alert-danger py-2">
            Invalid username, email, or password.
          </div>
        {% endif %}
        <div class="mb-3">
          <label for="id_username" class="form-label">Username</label>
          <input type="text" class="form-control" id="id_username" name="username" required autofocus>
        </div>
        <div class="mb-3">
          <label  class="form-label">Email</label>
          <input type="text" class="form-control"  name="email" required autofocus>
        </div>
        <div class="mb-3">
          <label for="id_password" class="form-label">Password</label>
          <input type="password" class="form-control" id="id_password" name="password" required>
        </div>
        <button type="submit" class="btn btn-login w-100 mt-2 mb-2">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
      </form>
      <div class="login-footer">
        <span>Forgot your password? <a href="#">Reset</a></span>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
