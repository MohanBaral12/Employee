<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body style="background: linear-gradient(rgba(255,255,255,0.7),rgba(255,255,255,0.7)), url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80') no-repeat center center fixed; background-size: cover;">

    {% include 'navbar.html'%}

<div class="container d-flex align-items-start justify-content-center mt-5 mb-5">
  <div class="col-md-11 p-4" style="background: rgba(255,255,255,0.25); border-radius: 18px; box-shadow: 0 8px 32px 0 rgba(31,38,135,0.37); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);">
    <h1 class="text-center my-3">Employee Management</h1>
    <h2 class="text-center my-3">List of Employees</h2>
    <table class="table table-bordered table-striped text-center align-middle shadow rounded">
      <thead class="table-primary">
        <tr>
          <th>ID</th>
          <th>Emp_Id</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Address</th>
          <th>Department</th>
          <th>Working</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody class="table-group-divider">
      {% for e in emps %}
        <tr>
          <th>{{forloop.counter}}</th>
          <th>{{e.emp_id}}</th>
          <td>{{e.name}}</td>
          <td>{{e.phone}}</td>
          <td>{{e.address}}</td>
          <td>{{e.department}}</td>
          <td>{{e.working}}</td>
          <td>
            <a href="update-emp/{{e.id}}" class="btn btn-sm btn-primary me-1">
              <i class="bi bi-pencil-square"></i> Edit
            </a>
            <a href="delete-emp/{{e.id}}" class="btn btn-sm btn-danger">
              <i class="bi bi-trash"></i> Delete
            </a>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
