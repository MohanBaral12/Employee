<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Employee</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      /* Add a background image and make it semi-transparent with a linear-gradient overlay */
      background: linear-gradient(rgba(255,255,255,0.3), rgba(255,255,255,0.3)),
                  url('https://cdn.wallpapersafari.com/20/74/MGydh6.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    /* Form background */
    #empForm {
      background-color: rgba(255,255,255,0.3); /* semi-transparent white */
      /* Optional: add a subtle box-shadow for better visibility */
      box-shadow: 0 4px 32px rgba(0,0,0,0.15);
    }
    /* Input default border and transition */
    #empForm .form-control {
      border: 2px solid #ced4da;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    /* Input focus style */
    #empForm .form-control:focus {
      border-color: #0d6efd; /* Bootstrap primary blue */
      box-shadow: 0 0 5px rgba(13, 110, 253, 0.5);
    }
    /* Submit button style */
    #empForm button[type="submit"] {
      background: linear-gradient(45deg, #0d6efd, #0056b3);
      border: none;
      font-weight: 600;
      transition: background 0.3s;
    }
    /* Submit button hover */
    #empForm button[type="submit"]:hover {
      background: linear-gradient(45deg, #0056b3, #003d7a);
    }
  </style>
</head>
<body>
  {% include 'navbar.html' %}

  <h1 class="text-center my-4">Add New Employee</h1>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <!-- Placeholder for success message -->
        <div id="successMessage" class="alert alert-success d-none" role="alert">
          Employee successfully added!
        </div>

        <!-- Placeholder for error message -->
        <div id="errorMessage" class="alert alert-danger d-none" role="alert">
          Complete fill the form.
        </div>

        <form action="/emp-add/" method="POST" class="text-center border p-4 shadow rounded bg-light" novalidate>
           {% csrf_token %}
          <div class="mb-3 text-start">
            <label for="empId" class="form-label">Employee ID</label>
            <input type="number" class="form-control" id="empId" name="emp_id" required />
          </div>

          <div class="mb-3 text-start">
            <label for="empName" class="form-label">Name</label>
            <input type="text" class="form-control" id="empName" name="emp_name" maxlength="200" required />
          </div>

          <div class="mb-3 text-start">
            <label for="empPhone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="empPhone" name="emp_phone" maxlength="20" required />
          </div>

          <div class="mb-3 text-start">
            <label for="empAddress" class="form-label">Address</label>
            <input type="text" class="form-control" id="empAddress" name="emp_address" maxlength="100" required />
          </div>

          <div class="mb-3 text-start">
            <label for="empDept" class="form-label">Department</label>
            <input type="text" class="form-control" id="empDept" name="emp_department" maxlength="20" required />
          </div>

          <div class="mb-3 form-check text-start">
            <input type="checkbox" class="form-check-input" id="empWorking" name="emp_working" checked />
            <label class="form-check-label" for="empWorking">Currently Working</label>
          </div>

          <button type="submit" class="btn btn-primary w-100">Add Employee</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  
</body>
</html>
